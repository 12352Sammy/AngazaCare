{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 540px; margin: 2rem auto;">
    <h2>Admin Login</h2>
    <form method="POST">
        <div class="form-field">
            <label for="email">Email</label>
            <input type="email" name="email" id="email" required />
        </div>
        <div class="form-field">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" required />
        </div>
        <button class="btn" type="submit">Login</button>
    </form>
    <p style="margin-top: 1rem;">Back to user login? <a href="/login">Login here</a>.</p>
    <p style="margin-top: 0.75rem; font-size: 0.95rem; color: #c7d2fe;">Admin / counselor login: <strong>admin@angazacare.com</strong> / <strong>admin123</strong></p>
</div>
{% endblock %}
